# Station settings
#
# After changing anything here, restart the app with:
#     systemctl --user restart station-app station-rigctld station-rigctld2
# Lines starting with # are notes and are ignored. A blank setting uses the built-in default.
# The setup helper (~/station/app/bin/setup.sh) fills in the callsign, location and radio.

[station]
# Your callsign. Until it's set, the display shows N0CALL and live DX spots stay off.
callsign =
# Your first name, for the greeting ("Good morning, Lee").
operator =
# Shown on your own card when you look up your callsign.
full_name =
licence =
# The place under the local clock, for example Alberta.
place =
# For example America/Edmonton. Blank uses this computer's time zone.
timezone =
# Blank works them out from your callsign's country.
cq_zone =
itu_zone =

# Where the station is: the grid square (for example DO32, or six characters such as DO32ab),
# or latitude and longitude instead. It makes the beam headings, distances and satellite
# passes exact. Until one of these is set, a placeholder in central Alberta is used.
grid =
latitude =
longitude =

[personal]
# Little personal touches. Leave a line blank to switch it off.
# licensed: the date on your certificate (year-month-day), for the anniversary greeting.
# birthday: month-day, for example 06-15.
# note: shown on your own card when you look up your callsign.
# helper: whoever looks after the station; the tester checklist says your notes are for them.
licensed =
birthday =
note =
helper =

[hamqth]
# Optional free account from https://www.hamqth.com. It adds names, towns
# and exact locations to look-ups. Leave blank to use the country file only.
username =
password =

[radio]
# The radio, through Hamlib. model 0 means no radio is set up yet; 1 is a practice radio for
# trying the display without one. The setup helper finds the model number, the cable and the
# speed, and fills these in. By hand: find the model number with  rigctl -l | grep -i 7300
# (for an IC-7300), and set device to the radio's USB serial port (/dev/serial/by-id/...).
name =
model = 0
device =
baud =
# Set to none or hardware if the radio only answers with that handshaking (the helper works this out).
handshake =
# The radio's full power in watts, for the power reading while transmitting.
max_watts = 100
# The bands this radio has antennas for. The spot list's band buttons, band openings and
# "Listen to yourself" show these bands (and the second radio's).
bands = 80m, 40m, 30m, 20m, 17m, 15m, 12m, 10m

[radio2]
# A second radio on its own cable (optional). model 0 means it isn't set up. Put its name here,
# then run ~/station/app/bin/radio2.sh (or "station radio2" remotely): it finds the cable and
# the speed it answers at, and fills these in. Its link uses its own port, rigctld_port.
name =
model = 0
device =
baud =
handshake =
rigctld_port = 4533
max_watts = 100
bands = 80m, 40m, 30m, 20m, 17m, 15m, 12m, 10m

[cluster]
# Where the live DX spots come from. The app signs in as your callsign with -2 added
# (for example VE6LDM-2), so it never clashes with your other programs.
host = dxc.ve7cc.net
port = 23
# If that node stops answering or sending spots, the app moves to the next of these
# (host:port), and tries the one above again every hour.
backups = dxc.ve7cc.net:23, dxc.nc7j.com:7373, k1ttt.net:7373, w3lpl.net:7373

[display]
port = 8073
# The red CQ zone numbers on the maps (click one to see what it is).
show_zones = yes
# Show only spots in the voice parts of each band (IARU Region 2 band plan).
voice_only = yes
# yes: looking up a station turns the flat map into a globe that shows the path.
# no: the map stays as it is. (The Flat map / Globe / Beam map buttons work either way.)
globe_on_lookup = yes
# yes: if the display is closed (Alt+F4) it opens again a few seconds later.
# no: it stays closed until it's opened from the menu (Station display) or the computer restarts.
keep_open = yes
# The welcome banner when the computer starts (click your callsign at the top left to see it again).
# no switches it off; welcome_text is the line under the callsign
# (blank: "On the air around the world", plus "from" and the place above if there is one).
welcome = yes
welcome_text =
# The Tester checklist link under the greeting: a tour of everything on the display, with
# notes for whoever looks after the station (station feedback shows them). no hides the link.
checklist = yes

[waterfall]
# A waterfall from an RTL-SDR (a NooElec, say) tapped into the radio's IF: the station app shows the band
# around the first radio's frequency on the computer's own screen, beside the station display.
# Leave it off without one.
# start: yes runs it, and opens it after login (and again if it's closed); no keeps it off.
start = no
# The radio's IF, where the SDR listens (69450000 is the FT-950's first IF).
if_hz = 69450000
# The SDR's gain in dB (0 to 49.6), or auto. Lower it if strong signals smear across the picture.
gain = 25
# Whether the picture is back to front (a radio that mixes down from above turns it round). auto finds
# out from the dial, by watching which way the stations move when it turns; yes or no settles it.
swap_iq = auto
# Moves the picture if the radio's frequency doesn't sit where it should (a steady error, such as the SDR's
# own crystal being a little off). Small drift on top of it is corrected by the app itself, from shortwave
# broadcast stations whose carriers sit exactly on 5 kHz steps; the health report says how it's doing.
offset_hz = 0
# The SDR's frequency error in parts per million (0 for a NooElec with a TCXO).
ppm = 0

[layout]
# With the waterfall on: what else opens on the computer's own screen (WSJT-X, the web browser, any other
# program) goes in a side area on the right, and the waterfall narrows to the left to make room; it takes the
# whole screen again when nothing is left beside it. Nothing new is left over the station display.
# keep: no leaves windows wherever they open.
keep = yes
# The side area's width in pixels (it widens by itself for a window that can't be that narrow, such as
# WSJT-X's Wide Graph, about 845).
side_width = 800

[alerts]
# Banners on the map for weather alerts near the station and for space weather, each with a
# link to the full warning. weather_region is Environment Canada's code for your alert area
# (Canada only). Find yours on https://weather.gc.ca/warnings/: it's the letters and digits at
# the end of your area's alert page address (after "report_e.html?"). Leave it blank to switch
# weather alerts off.
weather_region =
# Space weather from NOAA (solar flares, radiation and geomagnetic storms that affect HF).
space_weather = yes

[satellites]
# The FM satellites on the display, besides the ISS: any of SO-50, AO-123, AO-91, PO-101.
fm = SO-50, AO-123, AO-91, PO-101

[openings]
# "Who can hear you": where signals from stations near you are being heard right now, and who
# decodes your own FT8, from PSK Reporter's live feed (mqtt.pskreporter.info).
# When the bands are busy it uses roughly 50 to 100 MB of internet a day. no switches it off.
enabled = yes

[ft8]
# FT8 and the other digital modes with WSJT-X, heard through the waterfall's receiver. yes installs WSJT-X
# and gives it a virtual microphone that hears the radio's frequency while WSJT-X is open (WSJT-X lists it
# as station_receiver). It only receives: WSJT-X's transmit sound goes to a virtual speaker that goes
# nowhere (station_no_transmit), and WSJT-X follows the radio through a receive-only radio link (rig_port,
# below) that refuses anything that would make the radio transmit. It needs the waterfall (start = yes
# under [waterfall]).
enabled = no
# The port of WSJT-X's receive-only radio link (in WSJT-X's settings: Radio, Rig "Hamlib NET rigctl",
# Network Server 127.0.0.1:4534). It passes WSJT-X's reads and tuning on to the radio link (rigctld_port
# under [radio]) and refuses transmitting.
rig_port = 4534
